{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Create an account</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="width:100%">Create account</button>
  </form>
  <p style="text-align:center"><a href="{% url 'login' %}">I already have an account</a></p>
</div>
{% endblock %}
