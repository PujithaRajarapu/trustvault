<style>
  body { background: #eef2f7; font-family: Arial, sans-serif; padding: 24px; color: #222; max-width: 520px; margin: 0 auto; }
  h1 { color: #1f3a5f; }
  a { color: #1f6feb; text-decoration: none; }
  a:hover { text-decoration: underline; }
  input { padding: 8px; border: 1px solid #b8c4d4; border-radius: 6px; width: 100%; box-sizing: border-box; }
  button { background: #1f6feb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
  button:hover { background: #1558c0; }
  .helptext, ul { font-size: 13px; color: #555; }
</style>
<h1>TrustVault - Register</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Create account</button>
</form>
<p><a href="{% url 'login' %}">I already have an account</a></p>
