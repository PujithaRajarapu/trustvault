<style>
  body { background: #eef2f7; font-family: Arial, sans-serif; padding: 24px; color: #222; max-width: 800px; margin: 0 auto; }
  h1, h2 { color: #1f3a5f; }
  h2 { border-bottom: 2px solid #cfd8e3; padding-bottom: 6px; }
  a { color: #1f6feb; text-decoration: none; }
  a:hover { text-decoration: underline; }
  input, select { padding: 8px; border: 1px solid #b8c4d4; border-radius: 6px; box-sizing: border-box; max-width: 100%; }
  button { background: #1f6feb; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  button:hover { background: #1558c0; }
  ul { padding: 0; }
  li { background: white; padding: 10px; margin-bottom: 8px; border-radius: 8px; list-style: none; }
  table { border-collapse: collapse; width: 100%; background: white; font-size: 14px; }
  th, td { border: 1px solid #cfd8e3; padding: 6px 8px; text-align: left; }
  th { background: #dfe7f1; }
  .helptext { font-size: 13px; color: #555; }
</style>
<h1>Search</h1>
<form method="get" action="{% url 'search' %}">
  <input name="q" value="{{ q }}" maxlength="100" placeholder="Search your documents">
  <button type="submit">Search</button>
</form>

{% if q %}
  {% if results %}
  <ul>
    {% for d in results %}
    <li>{{ d.title }} ({{ d.original_name }})
      <a href="{% url 'download' d.id %}">Download</a></li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No matching documents.</p>
  {% endif %}
{% endif %}

<p><a href="{% url 'home' %}">Back</a></p>
